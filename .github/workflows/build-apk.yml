name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack Android project
        run: unzip -q Cam_v3_OV5640_Android_Source.zip
      - name: Build debug APK
        working-directory: CamV3Android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cam-v3-OV5640-debug-apk
          path: CamV3Android/app/build/outputs/apk/debug/app-debug.apk
