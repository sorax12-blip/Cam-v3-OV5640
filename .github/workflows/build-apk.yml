name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, esp32-cam-hd-s26-fix, ov3660-apk-v2.6.2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble accepted viewer into APK asset
        shell: bash
        run: |
          cat app/viewer_chunks/*.htmlpart > app/src/main/assets/index.html
          test "$(wc -c < app/src/main/assets/index.html)" -gt 4900000
          grep -Fq "UI Refresh Final v1 • APK Native BLE" app/src/main/assets/index.html
          grep -Fq ".toast{position:absolute" app/src/main/assets/index.html
          grep -Fq "bottom:4px" app/src/main/assets/index.html
          grep -Fq "await send('LIVE INFO');await send('INDEX')" app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-Cam-HD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
