<style>

.app{width:min(100%,920px);margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.header{display:flex;align-items:center;gap:14px;margin-bottom:18px}.logo{width:62px;height:62px;border-radius:14px;background:#080808;border:1px solid #593c14;display:grid;place-items:center;box-shadow:0 5px 20px #0008}.camIcon{width:47px;height:47px;position:relative}.camIcon:before{content:"";position:absolute;inset:4px;border:2px solid #c08b32;border-radius:6px;background:#111}.camIcon:after{content:"";position:absolute;width:21px;height:21px;left:13px;top:13px;border-radius:50%;border:4px solid #57417a;background:radial-gradient(circle at 35% 35%,#80d8ff 0 10%,#493861 18%,#0d0d0e 60%);box-shadow:0 0 0 2px #222}
.brand h1{margin:0;font-size:clamp(27px,7vw,39px);line-height:1;font-weight:850}.brand p{margin:5px 0 0;color:#aaa;font-size:clamp(15px,4vw,20px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}button{font:inherit;color:#f5f5f5;font-weight:800;cursor:pointer}.btn{height:58px;border-radius:18px;border:1px solid #4a4a4a;background:var(--solid);box-shadow:0 5px 18px #0005;font-size:18px}.connect{border:none;background:linear-gradient(#368cff,#176cff)}.connect.connected{background:linear-gradient(#27c66f,#118c4d)}.disconnect{background:#0d0d0d;border:1.5px solid var(--red);color:#b86169}.disconnect:disabled{opacity:.62}.tab.active{background:#242424;border-color:#707070}
.glass{background:var(--glass);border:1px solid rgba(190,190,190,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 5px 18px #0005}
.stats{display:grid;gap:12px;margin:4px 0 14px}.stat{height:76px;border-radius:18px;display:grid;grid-template-columns:58px 1fr;align-items:center;padding:0 22px}.statIcon{font-size:31px}.statValue{font-size:31px;font-weight:850;line-height:.95}.statLabel{margin-top:6px;color:#aaa;font-size:16px}
.pathRow{display:flex;gap:16px;align-items:center;margin-bottom:14px}.small{height:52px;padding:0 18px;border-radius:18px;border:1px solid #434343;background:var(--solid);color:#aaa;font-size:16px}.small:disabled{opacity:.82}.crumbs{font-weight:800;font-size:18px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.crumb{cursor:pointer}.sep{color:#777}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.action{height:56px;border-radius:18px;border:1px solid #494949;background:var(--solid);font-size:17px}.action:disabled{color:#777}
.panel{min-height:390px;border-radius:22px;padding:18px 16px 16px}.panelTitle{font-weight:800;font-size:18px;margin:0 0 10px}.list{display:grid;gap:9px}.item{min-height:67px;border-radius:16px;background:rgba(12,12,12,.80);border:1px solid #aaa2;display:grid;grid-template-columns:44px 1fr auto;align-items:center;padding:10px 14px;gap:10px}.ico{font-size:27px}.name{font-weight:800;overflow-wrap:anywhere}.meta{color:#aaa;font-size:13px;margin-top:2px}.chev{font-size:30px;color:#aaa}.picActions{display:flex;gap:7px;flex-wrap:wrap}.mini{border-radius:12px;padding:8px 10px;background:#1c1c1c;border:1px solid #505050;font-size:13px}
.empty{padding:110px 8px 40px;text-align:center;color:#bbb;font-size:16px}.info{display:none}.info.show{display:block}.files.hide{display:none}.infoCard{border-radius:22px;padding:20px}.infoGrid{display:grid;gap:10px}.infoRow{background:#101010cc;border:1px solid #aaa2;border-radius:15px;padding:14px}.infoKey{font-size:12px;text-transform:uppercase;color:#999;letter-spacing:.08em}.infoVal{margin-top:4px;font-weight:750}
.progress{height:5px;border-radius:999px;background:#ffffff1f;overflow:hidden;margin:-2px 2px 12px;display:none}.progress.show{display:block}.bar{height:100%;width:0;background:#2f86ff}.toast{position:fixed;z-index:50;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(90vw,620px);background:#0a0a0af5;border:1px solid #555;border-radius:14px;padding:11px 14px;color:#ddd;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}
.modal{position:fixed;z-index:60;inset:0;display:none;align-items:center;justify-content:center;background:#000e;padding:14px}.modal.open{display:flex}.modalBox{display:flex;flex-direction:column;gap:10px;max-width:96vw;max-height:96vh}.modalBar{display:flex;align-items:center;gap:10px}.modalName{flex:1}.modal img{max-width:94vw;max-height:82vh;object-fit:contain;border-radius:12px;background:#000}
@media(min-width:700px){.app{padding-left:28px;padding-right:28px}.btn{height:64px}.stat{height:82px}.panel{min-height:520px}}
</style></head><body>
<div id="wall"><svg viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs><filter id="b"><feGaussianBlur stdDeviation="1.1"/></filter><pattern id="p" width="180" height="180" patternUnits="userSpaceOnUse"><rect width="180" height="180" fill="#060707"/><g stroke="#61410e" stroke-width="2" opacity=".75"><path d="M0 24h52v42h75v52h53"/><path d="M0 142h36v-36h70v-45h74"/><path d="M24 0v38h48v63h52v79"/></g><g fill="none" stroke="#895c16" opacity=".75"><circle cx="52" cy="66" r="4"/><circle cx="106" cy="106" r="4"/><circle cx="127" cy="118" r="3"/></g><rect x="105" y="20" width="54" height="38" rx="4" fill="#111" stroke="#39352e"/><g fill="#80602f"><rect x="110" y="15" width="5" height="7"/><rect x="123" y="15" width="5" height="7"/><rect x="136" y="15" width="5" height="7"/><rect x="149" y="15" width="5" height="7"/></g></pattern></defs>
<rect width="720" height="1280" fill="url(#p)" filter="url(#b)"/><g transform="translate(405 745) rotate(-4)"><rect width="230" height="190" rx="9" fill="#151515" stroke="#705023" stroke-width="3"/><g stroke="#9a6e31" stroke-width="7"><path d="M15-5v12M35-5v12M55-5v12M75-5v12M95-5v12M115-5v12M135-5v12M155-5v12M175-5v12M195-5v12"/><path d="M15 183v14M35 183v14M55 183v14M75 183v14M95 183v14M115 183v14M135 183v14M155 183v14M175 183v14M195 183v14"/></g><text x="58" y="105" fill="#6f6251" font-size="48" font-family="Arial">ESP32</text></g>
</svg></div>
<div class="app">
<div class="header"><div class="logo"><div class="camIcon"></div></div><div class="brand"><h1>ESP32 Cam HD</h1><p>BLE Photo Viewer</p></div></div>
<div class="two"><button id="connectBtn" class="btn connect">Connect</button><button id="disconnectBtn" class="btn disconnect" disabled>Disconnect</button></div>
<div class="two"><button id="filesTab" class="btn tab active">Files</button><button id="infoTab" class="btn tab">Info</button></div>
<div id="progress" class="progress"><div id="bar" class="bar"></div></div>
<div id="filesView" class="files">
<div class="stats"><div class="stat glass"><div class="statIcon">📁</div><div><div id="folderValue" class="statValue">0</div><div class="statLabel">folders indexed</div></div></div><div class="stat glass"><div class="statIcon">🖼️</div><div><div id="picValue" class="statValue">0</div><div class="statLabel">pictures</div></div></div></div>
<div class="pathRow"><button id="upBtn" class="small" disabled>← Up</button><div id="crumbs" class="crumbs"></div></div>
<div class="actions"><button id="refreshBtn" class="action" disabled>Refresh folder</button><button id="reindexBtn" class="action" disabled>Re-index card</button></div>
<div class="panel glass"><div id="panelTitle" class="panelTitle">/</div><div id="list" class="list"></div><div id="empty" class="empty">Connect to the camera to browse the SD card.</div></div></div>
<div id="infoView" class="info"><div class="infoCard glass"><div class="infoGrid"><div class="infoRow"><div class="infoKey">BLE device</div><div class="infoVal">ESP32 Cam HD</div></div><div class="infoRow"><div class="infoKey">Media</div><div class="infoVal">Photos only</div></div><div class="infoRow"><div class="infoKey">Folder capacity</div><div class="infoVal">1,600 photo-number slots</div></div><div class="infoRow"><div class="infoKey">Camera support</div><div class="infoVal">OV3660 / OV5640 auto-detect</div></div></div></div></div>
</div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="modalBox"><div class="modalBar"><div id="modalName" class="modalName"></div><button id="closeModal" class="small">Close</button></div><img id="previewImg"></div></div>
<script>
(function(){'use strict';
var DEVICE_NAME='ESP32 Cam HD',SERVICE='b6a30001-6e8c-4b74-a4c2-3b33d2c7a001',COMMAND='b6a30002-6e8c-4b74-a4c2-3b33d2c7a001',STATUS='b6a30003-6e8c-4b74-a4c2-3b33d2c7a001',DATA='b6a30004-6e8c-4b74-a4c2-3b33d2c7a001';
var native=!!window.AndroidBridge,device,gatt,cmdChar,statusChar,dataChar,connected=false,statusBuffer='',folders=new Map(),currentPath='/',currentItems=[],activeListPath=null,transfer=null,previewUrl=null,toastTimer=null,folderTotal=0,pictureTotal=0;
function $(id){return document.getElementById(id)}function toast(s,p){var t=$('toast');if(!s){t.classList.remove('show');return}t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);if(!p)toastTimer=setTimeout(function(){t.classList.remove('show')},2500)}
function setStatus(s){if(!s||s==='Disconnected.'||s.indexOf('Camera not found')===0){toast('');return}if(s.indexOf('Viewing ')===0&&!transfer){toast('');return}toast(s,/^(Scanning|Connecting|Connected|Indexing|Re-indexing|Loading |Downloading |Saving )/.test(s))}
function setConnected(v){connected=v;$('connectBtn').disabled=v;$('disconnectBtn').disabled=!v;$('refreshBtn').disabled=!v;$('reindexBtn').disabled=!v;$('upBtn').disabled=!v||currentPath==='/';$('connectBtn').classList.toggle('connected',v);$('connectBtn').textContent=v?'Connected':'Connect'}
function norm(p){if(!p||p==='/')return '/';p=p.replace(/\\/g,'/').replace(/\/+/g,'/');if(p.charAt(0)!='/')p='/'+p;return p.length>1?p.replace(/\/$/,''):p}function parent(p){p=norm(p);if(p==='/')return null;var i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i)}function base(p){p=norm(p);return p==='/'?'/':p.slice(p.lastIndexOf('/')+1)}function fmt(n){n=+n||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function connect(){if(native){setStatus('Scanning for '+DEVICE_NAME+'…');window.AndroidBridge.connect();return}if(!navigator.bluetooth){setStatus('Web Bluetooth is not available in this browser.');return}navigator.bluetooth.requestDevice({filters:[{name:DEVICE_NAME}],optionalServices:[SERVICE]}).then(function(d){device=d;device.addEventListener('gattserverdisconnected',onDisconnected);setStatus('Connecting…');return device.gatt.connect()}).then(function(g){gatt=g;return g.getPrimaryService(SERVICE)}).then(function(s){return Promise.all([s.getCharacteristic(COMMAND),s.getCharacteristic(STATUS),s.getCharacteristic(DATA)])}).then(function(a){cmdChar=a[0];statusChar=a[1];dataChar=a[2];return Promise.all([statusChar.startNotifications(),dataChar.startNotifications()])}).then(function(){statusChar.addEventListener('characteristicvaluechanged',function(e){feedStatus(new TextDecoder().decode(e.target.value))});dataChar.addEventListener('characteristicvaluechanged',function(e){var v=e.target.value;feedData(new Uint8Array(v.buffer.slice(v.byteOffset,v.byteOffset+v.byteLength)))});onConnected()}).catch(function(e){setConnected(false);setStatus('Connect failed: '+e.message)})}
function disconnect(){if(native){window.AndroidBridge.disconnect();return}if(device&&device.gatt&&device.gatt.connected)device.gatt.disconnect();else onDisconnected()}function onConnected(){setConnected(true);folders.clear();currentItems=[];folderTotal=pictureTotal=0;stats();render();setStatus('Connected. Indexing SD card…');send('INDEX')}function onDisconnected(){setConnected(false);transfer=null;activeListPath=null;toast('')}
function send(t){if(!connected)return;if(native){window.AndroidBridge.sendCommand(t);return}var v=new TextEncoder().encode(t);if(cmdChar.writeValueWithoutResponse)cmdChar.writeValueWithoutResponse(v);else cmdChar.writeValue(v)}
function feedStatus(c){statusBuffer+=c;var i;while((i=statusBuffer.indexOf('\n'))>=0){var l=statusBuffer.slice(0,i).replace(/\r$/,'');statusBuffer=statusBuffer.slice(i+1);if(l)line(l)}}function line(l){if(l.indexOf('BEGIN INDEX')===0){folders.clear();folderTotal=pictureTotal=0;stats();setStatus('Indexing SD card…');return}if(l.indexOf('I\tD\t')===0){var a=l.split('\t'),p=norm(a[2]);folders.set(p,{dirs:+(a[3]||0),pics:+(a[4]||0),videos:+(a[5]||0),other:+(a[6]||0)});return}if(l.indexOf('END INDEX')===0){var m=l.match(/folders=(\d+).*pics=(\d+)/);folderTotal=m?+m[1]:folders.size;pictureTotal=m?+m[2]:0;stats();openFolder(currentPath);return}if(l.indexOf('BEGIN LIST ')===0){activeListPath=norm(l.slice(11).trim());currentItems=[];return}if(/^[DPVF]\t/.test(l)&&activeListPath){var x=l.split('\t');currentItems.push({type:x[0],path:norm(x[1]),size:+(x[2]||0)});return}if(l.indexOf('END LIST ')===0){activeListPath=null;render();return}if(l.indexOf('BEGIN GET ')===0){var g=l.match(/^BEGIN GET (.*) (\d+)$/);if(transfer&&g){transfer.expected=+g[2];progress()}return}if(l.indexOf('END GET ')===0){finish();return}if(l.indexOf('CANCEL GET')===0||l.indexOf('ERR ')===0){transfer=null;hideProgress();setStatus(l)}}
function stats(){$('folderValue').textContent=folderTotal;$('picValue').textContent=pictureTotal}function feedData(u){if(!transfer||u.length<4)return;var o=(u[0]|u[1]<<8|u[2]<<16|u[3]<<24)>>>0,b=u.slice(4);transfer.chunks.push({off:o,bytes:b});transfer.received+=b.length;progress()}function progress(){if(!transfer)return;$('progress').classList.add('show');var p=transfer.expected?Math.min(100,transfer.received*100/transfer.expected):0;$('bar').style.width=p+'%';setStatus((transfer.mode==='view'?'Loading ':'Downloading ')+base(transfer.path)+' — '+fmt(transfer.received)+(transfer.expected?' / '+fmt(transfer.expected):''))}function hideProgress(){$('progress').classList.remove('show');$('bar').style.width='0%'}
function assemble(){transfer.chunks.sort(function(a,b){return a.off-b.off});var n=transfer.expected||transfer.chunks.reduce(function(n,c){return Math.max(n,c.off+c.bytes.length)},0),o=new Uint8Array(n);transfer.chunks.forEach(function(c){o.set(c.bytes,c.off)});return o}function b64(bytes){var s='',step=32768;for(var i=0;i<bytes.length;i+=step)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+step));return btoa(s)}function finish(){if(!transfer)return;var t=transfer,bytes=assemble();transfer=null;hideProgress();toast('');if(t.mode==='view'){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));$('previewImg').src=previewUrl;$('modalName').textContent=t.path;$('modal').classList.add('open')}else{var fn=base(t.path);if(native){window.AndroidBridge.saveFile(fn,b64(bytes));setStatus('Saving '+fn+' to Downloads…')}else{var u=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);setStatus('Downloaded '+fn)}}}
function getPicture(p,m){if(transfer){setStatus('A transfer is already in progress.');return}transfer={path:p,mode:m,expected:0,received:0,chunks:[]};progress();send('GET '+p)}function childFolders(p){p=norm(p);var a=[];folders.forEach(function(v,k){if(k!=='/'&&k!==p&&parent(k)===p)a.push({type:'D',path:k,size:0})});a.sort(function(a,b){return a.path.localeCompare(b.path,undefined,{numeric:true})});return a}
function openFolder(p){currentPath=norm(p);$('upBtn').disabled=!connected||currentPath==='/';crumbs();currentItems=[];render();if(connected)send('LIST '+currentPath)}function crumbs(){var c=$('crumbs');c.innerHTML='';var r=document.createElement('span');r.className='crumb';r.textContent='SD';r.onclick=function(){openFolder('/')};c.appendChild(r);if(currentPath!=='/'){var cur='';currentPath.split('/').filter(Boolean).forEach(function(part){var s=document.createElement('span');s.className='sep';s.textContent='›';c.appendChild(s);cur+='/'+part;var e=document.createElement('span'),t=cur;e.className='crumb';e.textContent=part;e.onclick=function(){openFolder(t)};c.appendChild(e)})}}
function render(){$('panelTitle').textContent=currentPath;crumbs();var el=$('list');el.innerHTML='';var all=childFolders(currentPath).concat(currentItems.filter(function(x){return x.type==='P'}).sort(function(a,b){return a.path.localeCompare(b.path,undefined,{numeric:true})}));$('empty').style.display=all.length?'none':'block';$('empty').textContent=connected?'This folder is empty or still loading.':'Connect to the camera to browse the SD card.';all.forEach(function(it){var d=document.createElement('div');d.className='item';if(it.type==='D'){var meta=folders.get(it.path)?folders.get(it.path).pics+' photos':'Folder';d.innerHTML='<div class="ico">📁</div><div><div class="name">'+esc(base(it.path))+'</div><div class="meta">'+esc(meta)+'</div></div><div class="chev">›</div>';d.onclick=function(){openFolder(it.path)}}else{d.innerHTML='<div class="ico">🖼️</div><div><div class="name">'+esc(base(it.path))+'</div><div class="meta">'+esc(fmt(it.size))+'</div></div><div class="picActions"></div>';var a=d.querySelector('.picActions'),v=document.createElement('button'),dl=document.createElement('button');v.className=dl.className='mini';v.textContent='View';dl.textContent='Download';v.onclick=function(e){e.stopPropagation();getPicture(it.path,'view')};dl.onclick=function(e){e.stopPropagation();getPicture(it.path,'download')};a.appendChild(v);a.appendChild(dl)}el.appendChild(d)})}
function tab(files){$('filesTab').classList.toggle('active',files);$('infoTab').classList.toggle('active',!files);$('filesView').classList.toggle('hide',!files);$('infoView').classList.toggle('show',!files)}
$('connectBtn').onclick=connect;$('disconnectBtn').onclick=disconnect;$('filesTab').onclick=function(){tab(true)};$('infoTab').onclick=function(){tab(false)};$('upBtn').onclick=function(){var p=parent(currentPath);if(p)openFolder(p)};$('refreshBtn').onclick=function(){openFolder(currentPath)};$('reindexBtn').onclick=function(){folders.clear();currentItems=[];folderTotal=pictureTotal=0;stats();render();setStatus('Re-indexing SD card…');send('INDEX')};$('closeModal').onclick=function(){$('modal').classList.remove('open')};$('modal').onclick=function(e){if(e.target===$('modal'))$('modal').classList.remove('open')};
window.onNativeConnected=onConnected;window.onNativeDisconnected=onDisconnected;window.onNativeStatus=feedStatus;window.onNativeData=function(off,s){var bin=atob(s),u=new Uint8Array(bin.length+4);u[0]=off&255;u[1]=(off>>>8)&255;u[2]=(off>>>16)&255;u[3]=(off>>>24)&255;for(var i=0;i<bin.length;i++)u[i+4]=bin.charCodeAt(i);feedData(u)};window.onNativeMessage=setStatus;
stats();crumbs();setConnected(false);render();tab(true);
})();</script></body></html>
