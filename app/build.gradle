plugins { id 'com.android.application' }

android {
    namespace 'com.openai.camv3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.esp32camhd'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '2.6'
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
